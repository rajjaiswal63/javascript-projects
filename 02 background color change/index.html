<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background color change</title>
</head>
<body style="background-color: rgb(192, 124, 181); display: flex; justify-content: center; align-items: center; height: 90vh;">
    <div id="parent">
        <button id="red" style="background-color: red;">Red</button>
        <button id="green" style="background-color: green;">green</button>
        <button id="yellow" style="background-color: yellow;">Yellow</button>
        <button id="blue" style="background-color: rgb(138, 138, 233);">Blue</button>
        <button id="orange" style="background-color: orange;">Orange</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
